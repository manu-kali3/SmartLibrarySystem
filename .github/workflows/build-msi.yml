name: Build MSI Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout SmartLibrarySystem
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: nuget restore SmartLibrarySystem.sln

      - name: Build Release
        run: msbuild SmartLibrarySystem.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Install WiX
        run: dotnet tool install --tool-path SmartLibrarySystem/Installer/tools/wix wix --version 4.0.5

      - name: Build MSI
        run: |
          cd SmartLibrarySystem/Installer
          .\tools\wix\wix.exe build SmartLibrarySystem.wxs -arch x86 -out ..\..\SmartLibrarySystem.msi -bindpath ..\bin\Release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLibrarySystem-installer
          path: SmartLibrarySystem.msi

      - name: Push MSI to brevan-softwares/public
        run: |
          git clone https://${{ secrets.DEPLOY_TOKEN }}@github.com/manu-kali3/brevan-softwares.git brevan-softwares
          cp SmartLibrarySystem.msi brevan-softwares/public/SmartLibrarySystem.msi
          cd brevan-softwares
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/SmartLibrarySystem.msi
          git diff --cached --quiet || (git commit -m "Update SmartLibrarySystem installer [skip ci]" && git push)
